[tool.poetry]
name = "tg-bot"
version = "0.2.3"
description = "Xian Network Telegram Bot"
authors = ["endogen"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
python-telegram-bot = {extras = ["job-queue"], version = "^22.7"}
requests = "^2.33.1"
python-dotenv = "^1.2.2"
loguru = "^0.7.3"
psutil = "^7.2.2"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
segno = "^1.6.6"
qrcode-artistic = "^3.0.2"
plotly = "^6.7.0"
pytrends = "^4.9.2"
kaleido = "^1.2.0"
numpy = "^2.4.4"
xian-tech-py = {path = "../xian-py", develop = true}
xian-tech-accounts = {path = "../xian-contracting/packages/xian-accounts", develop = true}
xian-tech-runtime-types = {path = "../xian-contracting/packages/xian-runtime-types", develop = true}
websockets = "^16.0"
pickledb = "^1.6"
dex-trade-api = "^0.1.0"
aiohttp = "^3.13.5"
aiosqlite = "^0.22.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
mypy = "^1.20.2"
ruff = "^0.15.12"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.mypy]
python_version = "3.14"
files = ["config.py", "constants.py", "tests"]
follow_imports = "skip"
exclude = "^(plg/|web\\.py|plugin\\.py|main\\.py)$"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "ASYNC"]
ignore = ["ASYNC109", "ASYNC230", "E501", "E722", "N806"]

[tool.ruff.lint.per-file-ignores]
"plg/**/res/*.py" = ["E741", "F821"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
