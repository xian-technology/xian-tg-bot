[project]
name = "tg-bot"
version = "0.2.3"
description = "Xian Network Telegram Bot"
authors = [{ name = "endogen" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13.5,<4",
    "aiosqlite>=0.22.1,<0.23",
    "dex-trade-api>=0.1.0,<0.2",
    "fastapi>=0.136.1,<0.137",
    "kaleido>=1.2.0,<2",
    "loguru>=0.7.3,<0.8",
    "numpy>=2.4.4,<3",
    "pickledb>=1.6,<2",
    "plotly>=6.7.0,<7",
    "psutil>=7.2.2,<8",
    "python-dotenv>=1.2.2,<2",
    "python-telegram-bot[job-queue]>=22.7,<23",
    "pytrends>=4.9.2,<5",
    "qrcode-artistic>=3.0.2,<4",
    "requests>=2.33.1,<3",
    "segno>=1.6.6,<2",
    "uvicorn>=0.46.0,<0.47",
    "websockets>=16.0,<17",
    "xian-tech-accounts>=0.1.0,<0.2",
    "xian-tech-py>=0.4.20-beta.1,<0.5",
    "xian-tech-runtime-types>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15.12,<0.16",
]

[tool.uv]
package = false

[tool.uv.sources]
xian-tech-accounts = { path = "../xian-contracting/packages/xian-accounts", editable = true }
xian-tech-py = { path = "../xian-py", editable = true }
xian-tech-runtime-types = { path = "../xian-contracting/packages/xian-runtime-types", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
files = ["config.py", "constants.py", "tests"]
follow_imports = "skip"
exclude = "^(plg/|web\\.py|plugin\\.py|main\\.py)$"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "ASYNC"]
ignore = ["ASYNC109", "ASYNC230", "E501", "E722", "N806"]

[tool.ruff.lint.per-file-ignores]
"plg/**/res/*.py" = ["E741", "F821"]
