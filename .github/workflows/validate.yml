name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-tg-bot
        uses: actions/checkout@v7
        with:
          path: xian-tg-bot

      - name: Checkout xian-py
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - name: Checkout xian-contracting
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: xian-tg-bot
        run: uv sync --group dev

      - name: Ruff lint
        working-directory: xian-tg-bot
        run: uv run ruff check .

      - name: Run mypy
        working-directory: xian-tg-bot
        run: uv run mypy

      - name: Run tests
        working-directory: xian-tg-bot
        run: uv run pytest
